name: Build RPM/DEB packages

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch: {}

jobs:
  build:
    name: Build Go binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: go.sum

      - name: Build static linux/amd64 binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" -o musipal ./cmd/musipal

      - uses: actions/upload-artifact@v4
        with:
          name: musipal-linux-amd64
          path: musipal
          retention-days: 7

  package:
    name: Package (${{ matrix.target }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: rhel9
            image: almalinux:9
            type: rpm
            rpm_dist: el9
          - target: rhel10
            image: almalinux:10
            type: rpm
            rpm_dist: el10
          - target: ubuntu24.04
            image: ubuntu:24.04
            type: deb
            rpm_dist: ""
          - target: ubuntu26.04
            image: ubuntu:26.04
            type: deb
            rpm_dist: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: musipal-linux-amd64
          path: dist

      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ${{ matrix.type }} package in ${{ matrix.image }}
        run: |
          chmod +x dist/musipal
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -e VERSION="${{ steps.version.outputs.version }}" \
            -e TARGET="${{ matrix.target }}" \
            -e PKG_TYPE="${{ matrix.type }}" \
            -e RPM_DIST="${{ matrix.rpm_dist }}" \
            "${{ matrix.image }}" \
            bash /work/packaging/github/build-package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: musipal-${{ matrix.target }}-${{ matrix.type }}
          path: dist-pkg/*
          retention-days: 30

  release:
    name: Attach packages to GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: musipal-*-*
          merge-multiple: true

      - name: Create/update release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
