stages:
  - build
  - package

build_binary:
  image: golang:1.24-bookworm
  stage: build
  tags:
    - docker-executor
  variables:
    CGO_ENABLED: "0"
  script:
    - go build -trimpath -ldflags="-s -w" -o musipal ./cmd/musipal
  artifacts:
    paths:
      - musipal
    expire_in: 1 week

package_artifacts:
  image: ruby:3.2
  stage: package
  tags:
    - docker-executor
  needs:
    - job: build_binary
      artifacts: true
  before_script:
    - set -eux
    - apt-get update -y
    - apt-get install -y --no-install-recommends rpm dpkg-dev build-essential
    - gem install --no-document fpm
    - mkdir -p pkgroot/usr/local/bin
    - cp musipal pkgroot/usr/local/bin/musipal
    - chmod +x pkgroot/usr/local/bin/musipal
    - export VERSION="${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}"
  script:
    - fpm -s dir -t deb -n musipal -v "$VERSION" -C pkgroot usr/local/bin/musipal
    - fpm -s dir -t rpm -n musipal -v "$VERSION" -C pkgroot usr/local/bin/musipal
  artifacts:
    paths:
      - '*.deb'
      - '*.rpm'
    expire_in: 1 week
