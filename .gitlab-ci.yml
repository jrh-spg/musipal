stages:
  - build
  - package

variables:
  PIP_NO_CACHE_DIR: "off"

build_onefile:
  image: python:3.12-slim
  stage: build
  tags:
    - docker-executor
  before_script:
    - set -eux
    - apt-get update -y
    - apt-get install -y --no-install-recommends build-essential git curl ca-certificates gcc libffi-dev libsndfile1 libssl-dev pkg-config
    - python -m venv .venv
    - . .venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install pyinstaller tomlkit
  script:
    - ./packaging/build.sh --onefile
  artifacts:
    paths:
      - dist/musipal
    expire_in: 1 week

package_artifacts:
  image: ruby:3.2
  stage: package
  tags:
    - docker-executor
  needs:
    - job: build_onefile
      artifacts: true
  before_script:
    - set -eux
    - apt-get update -y
    - apt-get install -y --no-install-recommends rpm dpkg-dev build-essential
    - gem install --no-document fpm
    - mkdir -p pkgroot/usr/local/bin
    - cp dist/musipal pkgroot/usr/local/bin/musipal
    - chmod +x pkgroot/usr/local/bin/musipal
    - export VERSION="${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}"
  script:
    - fpm -s dir -t deb -n musipal -v "$VERSION" -C pkgroot usr/local/bin/musipal
    - fpm -s dir -t rpm -n musipal -v "$VERSION" -C pkgroot usr/local/bin/musipal
  artifacts:
    paths:
      - '*.deb'
      - '*.rpm'
    expire_in: 1 week
