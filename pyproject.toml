[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "musipal"
version = "0.1.0"
description = "CLI/TUI music player with playlists and Icecast support"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "musipal" }]
dependencies = [
  "colored>=2.2.4",
  "halo>=0.0.31",
  "prompt_toolkit>=3.0.48",
  "python-vlc>=3.0.20123",
  "mutagen>=1.47.0",
  "tomlkit>=0.12.5",
]

[project.scripts]
musipal = "musipal.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
